kind = "web"
previewPath = "/"
title = "Growth Store"
description = "A modern responsive marketplace for Growth Store, an imported-goods shop with category filtering, product search, pagination, cart subtotal, and WhatsApp ordering."
version = "1.0.0"
id = "artifacts/growth-store"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21523

[services.development]
run = "pnpm --filter @workspace/growth-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/growth-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/growth-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21523"
BASE_PATH = "/"
